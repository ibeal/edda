# edda access rules. First match wins.
#
# local  The unix socket is shared by volume with the one-shot sidecars and reachable by `docker exec`.
#        Whoever can reach it already has docker access, so no password: admin works here and ONLY here.
local   all     all                     trust

# TCP    Only the shared `agent` role, only the edda database, always with a password. The same rule
#        covers sandboxes on the agents network and the host's published port.
host    edda    agent   0.0.0.0/0       scram-sha-256

# Everything else over TCP — admin included, from anywhere — is refused.
host    all     all     0.0.0.0/0       reject
host    all     all     ::/0            reject
